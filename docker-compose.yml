services:
  cinetrack:
    build: .
    ports:
      - "127.0.0.1:8020:80"
    volumes:
      - mediatracker-data:/data
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mediatracker-data:
    name: mediatracker-data
