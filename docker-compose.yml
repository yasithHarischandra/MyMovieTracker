services:
  backend:
    build: ./backend
    ports:
      - "8020:8020"
    volumes:
      - mediatracker-data:/data
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mediatracker-data:
    name: mediatracker-data
