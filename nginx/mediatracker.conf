server {
    listen 80;
    server_name your-domain.com;  # Replace with your actual domain

    # Redirect HTTP → HTTPS (Certbot will manage this)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    # SSL certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Serve compiled Vue frontend
    root /var/www/mediatracker;
    index index.html;

    # SPA fallback — all non-API routes return index.html for Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to FastAPI backend container
    location /api/ {
        proxy_pass http://localhost:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Limit upload size (for Trakt JSON import)
        client_max_body_size 55M;
    }

    # Security — prevent access to dot files
    location ~ /\. {
        deny all;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
